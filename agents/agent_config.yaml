# Agent Configuration - IndyDevDan Style
# Configuration-driven agent orchestration

agents:
  spec_agent:
    name: "Specification Agent"
    model: "gpt-4o"
    temperature: 0.5
    max_tokens: 6000
    role: "architect"
    system_prompt: |
      You are an expert technical specification writer.
      Create detailed, actionable specifications that developers can follow.
      Include user stories, requirements, acceptance criteria, and technical details.
    capabilities:
      - create_specifications
      - design_architecture
      - define_interfaces
      - document_requirements
    
  code_agent:
    name: "Code Generation Agent"
    model: "gpt-4o"
    temperature: 0.3
    max_tokens: 8000
    role: "developer"
    system_prompt: |
      You are an expert developer who writes clean, efficient, production-ready code.
      Follow best practices, include error handling, and ensure code is maintainable.
    capabilities:
      - generate_code
      - refactor_code
      - optimize_performance
      - add_tests
      - document_code
    
  review_agent:
    name: "Code Review Agent"
    model: "gpt-4o"
    temperature: 0.4
    max_tokens: 4000
    role: "reviewer"
    system_prompt: |
      You are an expert code reviewer.
      Identify bugs, security issues, performance problems, and suggest improvements.
      Provide constructive feedback with specific recommendations.
    capabilities:
      - review_code
      - security_audit
      - performance_analysis
      - suggest_improvements
    
  test_agent:
    name: "Test Generation Agent"
    model: "gpt-4o"
    temperature: 0.3
    max_tokens: 6000
    role: "tester"
    system_prompt: |
      You are an expert QA engineer.
      Create comprehensive test suites including unit tests, integration tests, and edge cases.
      Ensure high code coverage and robust error handling.
    capabilities:
      - generate_unit_tests
      - generate_integration_tests
      - create_test_scenarios
      - validate_requirements

workflows:
  feature_development:
    name: "Complete Feature Development"
    description: "End-to-end feature implementation with specs, code, tests, and docs"
    steps:
      - agent: spec_agent
        task: create_specification
        input: "{feature_description}"
        output: specification
        
      - agent: code_agent
        task: generate_code
        input: "{specification}"
        output: implementation
        parallel: true
        
      - agent: test_agent
        task: generate_tests
        input: "{implementation}"
        output: tests
        parallel: true
        
      - agent: review_agent
        task: review_code
        input: "{implementation}"
        output: review_feedback
        
      - agent: code_agent
        task: apply_feedback
        input: "{implementation}, {review_feedback}"
        output: final_implementation
    
  api_development:
    name: "API Development Workflow"
    description: "Design and implement RESTful APIs"
    steps:
      - agent: spec_agent
        task: design_api
        input: "{api_requirements}"
        output: api_specification
        
      - agent: code_agent
        task: implement_api
        input: "{api_specification}"
        output: api_implementation
        
      - agent: test_agent
        task: generate_api_tests
        input: "{api_implementation}"
        output: api_tests
        
      - agent: spec_agent
        task: generate_api_docs
        input: "{api_implementation}"
        output: api_documentation
    
  refactoring_workflow:
    name: "Code Refactoring Workflow"
    description: "Systematic code improvement and optimization"
    steps:
      - agent: review_agent
        task: analyze_code
        input: "{existing_code}"
        output: improvement_suggestions
        
      - agent: code_agent
        task: refactor_code
        input: "{existing_code}, {improvement_suggestions}"
        output: refactored_code
        
      - agent: test_agent
        task: validate_refactoring
        input: "{refactored_code}, {existing_tests}"
        output: validation_results

prompts:
  create_specification:
    template: |
      Create a detailed technical specification for the following:
      
      {input}
      
      Include:
      1. Overview and objectives
      2. User stories
      3. Functional requirements
      4. Non-functional requirements
      5. Technical architecture
      6. Data models
      7. API contracts
      8. Acceptance criteria
      9. Testing strategy
      10. Timeline and milestones
  
  generate_code:
    template: |
      Implement the following based on this specification:
      
      {input}
      
      Requirements:
      - Follow best practices for {language}
      - Include comprehensive error handling
      - Add appropriate logging
      - Ensure code is production-ready
      - Make it maintainable and scalable
      - Include inline documentation
  
  review_code:
    template: |
      Perform a thorough code review of the following:
      
      {input}
      
      Check for:
      1. Code quality and readability
      2. Potential bugs and edge cases
      3. Security vulnerabilities
      4. Performance issues
      5. Best practices adherence
      6. Test coverage
      7. Documentation completeness
      
      Provide specific, actionable feedback.
  
  generate_tests:
    template: |
      Generate comprehensive tests for the following code:
      
      {input}
      
      Include:
      1. Unit tests for all functions/methods
      2. Integration tests for component interactions
      3. Edge case testing
      4. Error handling validation
      5. Performance tests where applicable
      
      Use {test_framework} and aim for >90% code coverage.

variables:
  # Default values that can be overridden
  language: python
  test_framework: pytest
  documentation_style: docstring
  code_style: pep8
  max_retries: 3
  timeout: 120

api_keys:
  # Reference environment variables
  openai: ${OPENAI_API_KEY}
  anthropic: ${ANTHROPIC_API_KEY}
  
monitoring:
  enabled: true
  endpoint: "http://localhost:8080/agent-event"
  track_events:
    - tool_use
    - prompt_submit
    - completion
    - error
  
  metrics:
    - execution_time
    - token_usage
    - success_rate
    - error_rate